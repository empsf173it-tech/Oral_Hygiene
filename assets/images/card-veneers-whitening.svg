<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffcc80"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Veneers vs Whitening comparison -->
  <g transform="translate(400,185)" opacity="0.85">
    <!-- Left tooth - Veneer -->
    <g transform="translate(-80,0)">
      <path d="M-22,-50 C-38,-50 -45,-32 -45,-12 C-45,12 -35,35 -28,55 C-25,62 -18,62 -16,55 C-12,42 -10,28 0,40 C10,28 12,42 16,55 C18,62 25,62 28,55 C35,35 45,12 45,-12 C45,-32 38,-50 22,-50 C12,-50 8,-38 0,-38 C-8,-38 -12,-50 -22,-50Z" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
      <!-- Veneer layer on front -->
      <path d="M-18,-45 C-8,-45 -5,-35 0,-35 C5,-35 8,-45 18,-45 C28,-45 35,-30 35,-12 C35,5 28,20 22,35" fill="none" stroke="#e65100" stroke-width="2.5" stroke-dasharray="4,3"/>
      <text x="0" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">VENEERS</text>
    </g>
    <!-- VS text -->
    <text x="0" y="5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#bf360c" opacity="0.7">VS</text>
    <!-- Right tooth - Whitening -->
    <g transform="translate(80,0)">
      <path d="M-22,-50 C-38,-50 -45,-32 -45,-12 C-45,12 -35,35 -28,55 C-25,62 -18,62 -16,55 C-12,42 -10,28 0,40 C10,28 12,42 16,55 C18,62 25,62 28,55 C35,35 45,12 45,-12 C45,-32 38,-50 22,-50 C12,-50 8,-38 0,-38 C-8,-38 -12,-50 -22,-50Z" fill="#ffffff" stroke="#f57f17" stroke-width="2"/>
      <!-- Sparkles for whitening -->
      <circle cx="-15" cy="-25" r="4" fill="#ffd600"/>
      <circle cx="12" cy="-15" r="3" fill="#ffd600"/>
      <circle cx="-5" cy="-35" r="2.5" fill="#ffd600"/>
      <line x1="20" y1="-35" x2="30" y2="-45" stroke="#ffd600" stroke-width="2"/>
      <line x1="25" y1="-30" x2="35" y2="-30" stroke="#ffd600" stroke-width="2"/>
      <line x1="30" y1="-25" x2="35" y2="-20" stroke="#ffd600" stroke-width="2"/>
      <text x="0" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">WHITENING</text>
    </g>
  </g>
</svg>
