<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#f48fb1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Toddler dental care - baby tooth + toothbrush -->
  <g transform="translate(400,180)" opacity="0.85">
    <!-- Cute baby tooth with smile -->
    <path d="M-25,-50 C-42,-50 -50,-32 -50,-10 C-50,15 -38,38 -30,55 C-27,63 -20,63 -17,55 C-12,40 -8,25 0,38 C8,25 12,40 17,55 C20,63 27,63 30,55 C38,38 50,15 50,-10 C50,-32 42,-50 25,-50 C13,-50 8,-37 0,-37 C-8,-37 -13,-50 -25,-50Z" fill="#fff" stroke="#c2185b" stroke-width="2.5"/>
    <!-- Cute face on tooth -->
    <circle cx="-12" cy="-18" r="4" fill="#c2185b"/>
    <circle cx="12" cy="-18" r="4" fill="#c2185b"/>
    <path d="M-10,0 Q0,12 10,0" fill="none" stroke="#c2185b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="-22" cy="-5" rx="6" ry="4" fill="#f8bbd0" opacity="0.7"/>
    <ellipse cx="22" cy="-5" rx="6" ry="4" fill="#f8bbd0" opacity="0.7"/>
    <!-- Small toothbrush beside -->
    <g transform="translate(70,-20) rotate(25)">
      <rect x="-4" y="-40" width="8" height="55" rx="3" fill="#4fc3f7" stroke="#0288d1" stroke-width="1"/>
      <rect x="-6" y="-55" width="12" height="18" rx="2" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
      <!-- Bristles -->
      <line x1="-4" y1="-55" x2="-4" y2="-62" stroke="#81d4fa" stroke-width="1.5"/>
      <line x1="-1" y1="-55" x2="-1" y2="-63" stroke="#81d4fa" stroke-width="1.5"/>
      <line x1="2" y1="-55" x2="2" y2="-62" stroke="#81d4fa" stroke-width="1.5"/>
      <line x1="5" y1="-55" x2="5" y2="-61" stroke="#81d4fa" stroke-width="1.5"/>
    </g>
    <!-- Stars -->
    <circle cx="-60" cy="-40" r="3" fill="#ffd600"/>
    <circle cx="60" cy="-55" r="2.5" fill="#ffd600"/>
    <circle cx="-50" cy="30" r="2" fill="#ffd600"/>
  </g>
</svg>
