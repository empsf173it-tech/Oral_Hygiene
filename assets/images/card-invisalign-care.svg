<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede7f6"/>
      <stop offset="100%" style="stop-color:#b39ddb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Invisalign clear aligner -->
  <g transform="translate(400,190)" opacity="0.85">
    <!-- Clear aligner tray outline -->
    <path d="M-90,10 C-90,-40 -60,-65 -30,-62 C-15,-60 -8,-50 0,-50 C8,-50 15,-60 30,-62 C60,-65 90,-40 90,10 C90,25 80,35 60,38 C30,42 -30,42 -60,38 C-80,35 -90,25 -90,10Z" fill="rgba(255,255,255,0.4)" stroke="#5e35b1" stroke-width="2.5" stroke-dasharray="8,4"/>
    <!-- Teeth visible through aligner -->
    <rect x="-55" y="-25" width="15" height="25" rx="4" fill="rgba(255,255,255,0.6)" stroke="#7e57c2" stroke-width="1"/>
    <rect x="-35" y="-35" width="15" height="30" rx="4" fill="rgba(255,255,255,0.6)" stroke="#7e57c2" stroke-width="1"/>
    <rect x="-15" y="-38" width="15" height="33" rx="4" fill="rgba(255,255,255,0.6)" stroke="#7e57c2" stroke-width="1"/>
    <rect x="5" y="-38" width="15" height="33" rx="4" fill="rgba(255,255,255,0.6)" stroke="#7e57c2" stroke-width="1"/>
    <rect x="25" y="-35" width="15" height="30" rx="4" fill="rgba(255,255,255,0.6)" stroke="#7e57c2" stroke-width="1"/>
    <rect x="45" y="-25" width="15" height="25" rx="4" fill="rgba(255,255,255,0.6)" stroke="#7e57c2" stroke-width="1"/>
    <!-- Alignment arrows -->
    <path d="M-70,-50 L-55,-40" stroke="#4527a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M70,-50 L55,-40" stroke="#4527a0" stroke-width="2" fill="none"/>
    <!-- Sparkles -->
    <circle cx="-75" cy="0" r="3" fill="#ffd600" opacity="0.6"/>
    <circle cx="75" cy="0" r="3" fill="#ffd600" opacity="0.6"/>
    <circle cx="0" cy="55" r="2.5" fill="#ffd600" opacity="0.5"/>
  </g>
</svg>
