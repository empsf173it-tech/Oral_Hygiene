<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eaf6"/>
      <stop offset="100%" style="stop-color:#9fa8da"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Tooth with filling indicator -->
  <g transform="translate(400,180)" fill="#3949ab" opacity="0.85">
    <path d="M-30,-60 C-50,-60 -60,-40 -60,-15 C-60,15 -45,45 -35,70 C-30,82 -20,82 -15,70 C-8,50 -5,30 0,50 C5,30 8,50 15,70 C20,82 30,82 35,70 C45,45 60,15 60,-15 C60,-40 50,-60 30,-60 C15,-60 10,-45 0,-45 C-10,-45 -15,-60 -30,-60Z" stroke="#1a237e" stroke-width="2" fill="none"/>
    <!-- Filling area inside tooth -->
    <ellipse cx="0" cy="-20" rx="18" ry="14" fill="#7986cb" opacity="0.7"/>
    <ellipse cx="0" cy="-20" rx="10" ry="8" fill="#c5cae9"/>
    <!-- Dental tool -->
    <line x1="65" y1="-70" x2="15" y2="-25" stroke="#1a237e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="-73" r="5" fill="#1a237e"/>
    <!-- Small droplets -->
    <circle cx="-50" cy="-40" r="3" fill="#42a5f5" opacity="0.5"/>
    <circle cx="-60" cy="-25" r="2" fill="#42a5f5" opacity="0.4"/>
    <circle cx="50" cy="10" r="2.5" fill="#42a5f5" opacity="0.5"/>
  </g>
</svg>
