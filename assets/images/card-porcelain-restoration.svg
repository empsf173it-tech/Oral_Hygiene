<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#90caf9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Full arch porcelain restoration -->
  <g transform="translate(400,200)" opacity="0.85">
    <!-- Upper arch of teeth -->
    <path d="M-120,0 C-120,-60 -80,-90 -40,-85 C-20,-82 -10,-70 0,-70 C10,-70 20,-82 40,-85 C80,-90 120,-60 120,0" fill="none" stroke="#1565c0" stroke-width="3"/>
    <!-- Individual crowns on arch -->
    <rect x="-105" y="-20" width="18" height="28" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="-82" y="-35" width="18" height="33" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="-58" y="-50" width="18" height="38" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="-34" y="-58" width="18" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="-12" y="-60" width="24" height="42" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <rect x="16" y="-58" width="18" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="40" y="-50" width="18" height="38" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="64" y="-35" width="18" height="33" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="88" y="-20" width="18" height="28" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
    <!-- Crown sparkles -->
    <circle cx="0" cy="-75" r="4" fill="#ffd600"/>
    <line x1="0" y1="-85" x2="0" y2="-65" stroke="#ffd600" stroke-width="1.5"/>
    <line x1="-10" y1="-75" x2="10" y2="-75" stroke="#ffd600" stroke-width="1.5"/>
  </g>
</svg>
