<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5"/>
      <stop offset="100%" style="stop-color:#ce93d8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Braces / Orthodontics icon -->
  <g transform="translate(400,185)" fill="none" stroke="#6a1b9a" stroke-width="2.5" opacity="0.85">
    <!-- Row of teeth -->
    <rect x="-70" y="-40" width="22" height="30" rx="5" fill="#e1bee7"/>
    <rect x="-42" y="-45" width="22" height="35" rx="5" fill="#e1bee7"/>
    <rect x="-14" y="-48" width="22" height="38" rx="5" fill="#e1bee7"/>
    <rect x="14" y="-48" width="22" height="38" rx="5" fill="#e1bee7"/>
    <rect x="42" y="-45" width="22" height="35" rx="5" fill="#e1bee7"/>
    <rect x="70" y="-40" width="22" height="30" rx="5" fill="#e1bee7"/>
    <!-- Braces wire -->
    <line x1="-59" y1="-22" x2="-31" y2="-25" stroke="#6a1b9a" stroke-width="3"/>
    <line x1="-31" y1="-25" x2="-3" y2="-26" stroke="#6a1b9a" stroke-width="3"/>
    <line x1="-3" y1="-26" x2="25" y2="-26" stroke="#6a1b9a" stroke-width="3"/>
    <line x1="25" y1="-26" x2="53" y2="-25" stroke="#6a1b9a" stroke-width="3"/>
    <line x1="53" y1="-25" x2="81" y2="-22" stroke="#6a1b9a" stroke-width="3"/>
    <!-- Brackets -->
    <rect x="-63" y="-27" width="8" height="8" rx="1" fill="#7b1fa2"/>
    <rect x="-35" y="-30" width="8" height="8" rx="1" fill="#7b1fa2"/>
    <rect x="-7" y="-31" width="8" height="8" rx="1" fill="#7b1fa2"/>
    <rect x="21" y="-31" width="8" height="8" rx="1" fill="#7b1fa2"/>
    <rect x="49" y="-30" width="8" height="8" rx="1" fill="#7b1fa2"/>
    <rect x="77" y="-27" width="8" height="8" rx="1" fill="#7b1fa2"/>
    <!-- Smile curve -->
    <path d="M-75,30 Q0,70 75,30" stroke="#ab47bc" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
